[workspace]
resolver = "2"
members = [
    "crates/bar",
    "crates/plugin-sdk",
    "plugins/calendar",
    "plugins/workspaces",
    "plugins/windows",
]

[workspace.package]
version = "0.2.0"
edition = "2021"
license = "MIT"

[workspace.dependencies]
dool-plugin-sdk = { path = "crates/plugin-sdk" }
gtk4 = { version = "0.11", features = ["v4_12"] }
gtk4-layer-shell = "0.9"
resvg = "0.50"
async-channel = "2"
libc = "0.2"
chrono = "0.4"
anyhow = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = { version = "0.8", features = ["preserve_order"] }
log = "0.4"
dirs = "5"
